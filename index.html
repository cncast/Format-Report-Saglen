<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Excel Report Format Saglen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
        }

        .header-gradient {
            background: linear-gradient(135deg, #437AB9, #1763b9);
            color: white;
        }

        .upload-box {
            background: white;
            border: 2px dashed #d8dee9;
            border-radius: 12px;
            padding: 20px;
            transition: .25s;
        }

        .upload-box:hover {
            border-color: #437AB9;
        }

        .form-control {
            border-radius: 12px;
        }

        .btn-generate {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }

        #status {
            display: none;
        }

        .footer-text {
            font-size: .9rem;
            color: #6c757d;
        }
    </style>

</head>

<body>

    <div class="container py-5">

        ```
        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card main-card">

                    <div class="card-header header-gradient p-4">

                        <h2 class="mb-2">
                            <i class="bi bi-file-earmark-spreadsheet-fill"></i>
                            Generador de Formato Saglen
                        </h2>

                        <div class="opacity-75">
                            Cargue el logo de la empresa, un texto de encabezado y un archivo Excel exportado de Odoo para generar un formato del reporte.
                        </div>

                    </div>

                    <div class="card-body p-4">

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                <i class="bi bi-image-fill"></i>
                                Logo de la empresa
                            </label>

                            <div class="upload-box">
                                <input type="file" class="form-control" id="imageFile" accept="image/*">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                <i class="bi bi-card-text"></i>
                                Texto de Encabezado
                            </label>

                            <textarea id="description" class="form-control" rows="6"
                                placeholder="Escriba un texto para el encabezado del reporte..."></textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                <i class="bi bi-file-earmark-excel-fill"></i>
                                Archivo XLSX exportado de Odoo
                            </label>

                            <div class="upload-box">

                                <input type="file" class="form-control" id="xlsxFile" accept=".xlsx">

                            </div>

                        </div>

                        <div class="d-grid">

                            <button class="btn btn-success btn-lg btn-generate" onclick="procesar()">

                                <i class="bi bi-gear-fill"></i>
                                Generar XLSX

                            </button>

                        </div>

                        <div id="status" class="alert mt-4">
                        </div>

                    </div>

                    <div class="card-footer text-center bg-white py-3">

                        <div class="footer-text">

                        </div>

            </div>

        </div>
        ```

    </div>

    <script>

        function setStatus(texto, tipo = "info") {

            const div =
                document.getElementById("status");

            div.style.display = "block";

            div.className =
                "alert alert-" + tipo + " mt-4";

            div.innerHTML = texto;
        }

        async function imageToBase64(file) {

            return new Promise((resolve, reject) => {

                const reader = new FileReader();

                reader.onload = () => {
                    resolve(reader.result.split(",")[1]);
                };

                reader.onerror = reject;

                reader.readAsDataURL(file);

            });

        }

        async function procesar() {

            try {

                const excelFile =
                    document.getElementById("xlsxFile").files[0];

                if (!excelFile) {

                    setStatus(
                        '<i class="bi bi-exclamation-circle-fill"></i> Debe seleccionar un archivo XLSX.',
                        'warning'
                    );

                    return;
                }

                const imageFile =
                    document.getElementById("imageFile").files[0];

                const description =
                    document.getElementById("description").value;

                setStatus(
                    '<div class="spinner-border spinner-border-sm me-2"></div> Leyendo archivo Excel...'
                );

                const data =
                    await excelFile.arrayBuffer();

                const sourceWorkbook =
                    XLSX.read(data, {
                        type: "array",
                        cellDates: true
                    });

                const firstSheet =
                    sourceWorkbook.SheetNames[0];

                const sourceSheet =
                    sourceWorkbook.Sheets[firstSheet];

                const rows =
                    XLSX.utils.sheet_to_json(
                        sourceSheet,
                        {
                            header: 1,
                            raw: true,
                            defval: null
                        }
                    );

                const wb =
                    new ExcelJS.Workbook();

                const ws =
                    wb.addWorksheet("Resultado");

                let rowIndex = 1;

                const imageHeightRows = 7;

                if (imageFile) {

                    const imageId =
                        wb.addImage({
                            base64: await imageToBase64(imageFile),
                            extension:
                                imageFile.name.toLowerCase().endsWith(".png")
                                    ? "png"
                                    : "jpeg"
                        });

                    ws.addImage(imageId, {
                        tl: { col: 0, row: 0 },
                        ext: { width: 250, height: 120 }
                    });

                    // Descripción comienza en columna C
                    if (description) {

                        const lastColumn =
                            Math.max(
                                rows[0].length,
                                8
                            );

                        const startColumn = 3; // C

                        ws.mergeCells(
                            1,
                            startColumn,
                            imageHeightRows,
                            lastColumn
                        );

                        const descriptionCell =
                            ws.getCell(1, startColumn);

                        descriptionCell.value =
                            description;

                        descriptionCell.alignment = {
                            wrapText: true,
                            vertical: "top",
                            horizontal: "left"
                        };

                        descriptionCell.font = {
                            size: 12,
                            bold: true
                        };

                    }

                    rowIndex = imageHeightRows + 2;
                }
                const headers =
                    rows[0];

                const headerRow =
                    ws.getRow(rowIndex);

                headers.forEach((header, index) => {

                    let newHeader =
                        header;

                    if (
                        typeof header === "string" &&
                        header.includes("/")
                    ) {

                        const parts =
                            header.split("/");

                        newHeader =
                            parts[1]?.trim() || header;
                    }

                    const cell =
                        headerRow.getCell(index + 1);

                    cell.value =
                        newHeader;

                    cell.font = {
                        bold: true,
                        color: {
                            argb: "FFFFFFFF"
                        }
                    };

                    cell.fill = {
                        type: "pattern",
                        pattern: "solid",
                        fgColor: {
                            argb: "FF437AB9"
                        }
                    };

                    cell.alignment = {
                        horizontal: "center",
                        vertical: "middle"
                    };

                });

                rowIndex++;

                for (let i = 1; i < rows.length; i++) {

                    const sourceRow =
                        rows[i];

                    const targetRow =
                        ws.getRow(rowIndex);

                    sourceRow.forEach((value, col) => {

                        targetRow.getCell(col + 1).value =
                            value;

                    });

                    rowIndex++;

                }

                ws.columns.forEach(column => {

                    let max = 12;

                    column.eachCell(
                        { includeEmpty: true },
                        cell => {

                            let len = 0;

                            if (cell.value instanceof Date) {

                                len = 10; // dd/mm/yyyy

                            } else if (cell.value) {

                                len = cell.value.toString().length;

                            }

                            if (len > max) {
                                max = len;
                            }

                        }
                    );

                    column.width = max + 2;

                });

                ws.eachRow((row) => {

                    for (let i = 1; i <= ws.columnCount; i++) {

                        row.getCell(i).border = {};

                    }

                });

                const buffer =
                    await wb.xlsx.writeBuffer();

                const blob =
                    new Blob(
                        [buffer],
                        {
                            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                        }
                    );

                const url =
                    URL.createObjectURL(blob);

                const a =
                    document.createElement("a");

                a.href = url;
                a.download = "resultado.xlsx";
                a.click();

                URL.revokeObjectURL(url);

                setStatus(
                    '<i class="bi bi-check-circle-fill"></i> Archivo generado correctamente.',
                    'success'
                );

            }
            catch (error) {

                console.error(error);

                setStatus(
                    '<i class="bi bi-x-circle-fill"></i> ' +
                    error.message,
                    'danger'
                );

            }

        }
    </script>

</body>

</html>
